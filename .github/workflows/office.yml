name: MY AI OFFICE

on:
  schedule:
    - cron: "0 12 * * *"    # 21:00 KST  생성 (3일치 재고 채우기)
    - cron: "25 0 * * *"    # 09:25 KST  → 09:30 게시 (여행)
    - cron: "25 3 * * *"    # 12:25 KST  → 12:30 게시 (고양이)
    - cron: "25 7 * * *"    # 16:25 KST  → 16:30 게시 (여행)
    - cron: "25 10 * * *"   # 19:25 KST  → 19:30 게시 (고양이)
    - cron: "0 23 * * 0"    # 월 08:00 KST  토큰 갱신
  workflow_dispatch:
    inputs:
      command:
        description: "selftest / produce / post / refresh / skip"
        required: true
        default: selftest
      arg:
        description: "skip 할 게시물 (예: 2026-11-05_1230)"
        required: false
        default: ""

permissions:
  contents: write   # 공개 저장소: 60일 무활동 시 예약이 꺼지는 것을 막는 주간 기록용

concurrency:
  group: turnerbro-office
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행할 일 정하기
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * *")  echo "cmd=produce" >> "$GITHUB_OUTPUT" ;;
            "0 23 * * 0")  echo "cmd=refresh" >> "$GITHUB_OUTPUT" ;;
            "")            echo "cmd=${{ github.event.inputs.command }}" >> "$GITHUB_OUTPUT" ;;
            *)             echo "cmd=post" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: 실행
        run: python -m office.run ${{ steps.pick.outputs.cmd }} ${{ github.event.inputs.arg }}
      - name: 주간 활동 기록 (공개 저장소 예약 유지)
        if: steps.pick.outputs.cmd == 'refresh'
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > heartbeat.txt
          git config user.name "AI OFFICE"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "주간 활동 기록" || true
          git push || true
