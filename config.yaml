caption:
  max_chars: 40
  max_emoji: 1
  banned: [여유롭게, 포근한, 사랑스러운, 우뚝, 가득한, 힐링, 아름다운, 풍경을 자랑, 매력적인, 감성]
  # 직접 쓰거나 고치신 실제 게시 문구 = 말투 기준. 사이트/설정에서 계속 늘립니다.
  examples:
    - "고양이 자세는 귀엽다. 목욕은 싫어하면서."
    - "뭘보냥?"
    - "신주쿠역. 참 많이 다녔는데"
    - "빨래 바구니가 어느새 고양이 전용 자리가 됐다..."

