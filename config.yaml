# ───────── 네이버 블로그 글감 패키지 (업로드는 Mr. MOON 이 직접) ─────────
blog:
  daily_image_limit: 24          # 블로그 그림 하루 상한 (Threads 와 별도)
  image_size: 1536x1024          # 가로형. 모델이 지원하지 않으면 1024x1024 로 자동 대체
  blogs:
    cinepark:
      name: CINEPARK
      images: 6                  # 썸네일 1 + 본문 5
      schedule_days: [0, 1, 2, 3, 4, 5, 6]   # 기본 예약: 매일 (0=월 … 6=일). 데스크에서 바꿀 수 있음
      schedule_mode: draft       # 예약 방식: draft = 밤새 깊이 쓴 원고(편집장 3회·사실 확인)까지, 그림은 대표님이 읽고 '그림 그리기' / topics = 글감 3개만 / full = 완성본까지
      info_days: []              # 정보글 자동 예약 요일 (비움 = 예약은 매일 기획기사, 정보글은 데스크에서 필요할 때만)
      exclude_topics:            # 글감으로 내지 않는 주제 (대표님이 직접 정리)
        - 베트남 영화 흥행순위 (매년 1월 연말 데이터로 직접 정리)
        - 인도네시아 영화 흥행순위 (매년 1월 연말 데이터로 직접 정리)
      reference_files: []
      reference_local:           # SHIHO 새 옷 기준 (2026-11-05 수정본): 정면 상반신 + 6동작 시트
        - refs/shiho_portrait.jpg
        - refs/shiho_sheet.jpg
      image_style: >-
        Match the face, hair and outfit of the woman in the attached reference images exactly.
        Semi-realistic 3D render with soft photographic quality, soft diffused daylight from a window, airy and bright, 16:9 landscape.
        Calm minimal interior: white walls, beige and light oak tones.
        Show only the objects named in the description and nothing else. Sparse minimal setting with large areas of empty space,
        no decorative props, no flowers, no clutter.
        She is the only person in the frame. No text, letters or numbers.
      scene_style: >-
        Realistic photograph like a calm lifestyle editorial photo shot on a full-frame camera, soft diffused daylight from a window unless the description states evening, airy and bright, 16:9 landscape.
        Calm minimal palette: for interiors white walls, beige and light oak tones; for landscapes soft natural colors. Muted colors.
        Show only the objects named in the description and nothing else. Sparse minimal composition with large areas of empty space,
        no decorative props, no flowers, no extra film reels, no clutter.
        No people anywhere in the image, no hands, no silhouettes. No text, letters, numbers or logos.
      crew_style: >-
        Premium high-end cinematic 3D rendering, stylised realism with sophisticated 3D character design, physically based materials,
        natural skin shading, detailed hair strands, believable fabric folds, global illumination, soft contact shadows,
        subtle volumetric lighting, realistic depth of field, extremely detailed set pieces and environmental storytelling,
        warm and cool colour harmony, the production quality of a high-budget animated feature film.
        Wide cinematic establishing shot, 16:9 landscape, 24mm wide-angle lens, eye-level camera.
        The film set is brightly lit and is the primary visual focus; the surrounding studio stays darker, lit by practical film lights.
        The artificial nature of the set stays visible: backdrop edges, support bars, clamps, scaffolding.
        When reference images are attached, the woman from them keeps the same face, hairstyle and body proportions, wearing the outfit described;
        her entire figure is clearly visible at the far left of the frame and she does not block the set.
        Background crew are few, small, discreet and out of focus, a natural mix of men and women, and nobody stands in front of the set or the backdrop.
        No 2D anime drawing, no watercolor illustration, no cel shading, no flat cartoon rendering. No distorted anatomy, extra limbs or unnatural hands.
        No costumes of existing film or comic characters. No text, letters, numbers, subtitles, signs, watermarks or logos.
      character: >-
        SHIHO, a young Korean woman with long straight black hair in a high ponytail, wearing a white
        short-sleeved collared button-up shirt tucked into light blue wide-leg jeans, white sneakers and a
        beige leather shoulder bag, matching the woman in the attached reference images exactly
      crew_character: >-
        SHIHO, a young adult Korean woman with long glossy black hair in a high ponytail with a few loose strands framing her face,
        wearing a fitted white sleeveless top, light blue wide-leg jeans, white sneakers and a small beige crossbody shoulder bag,
        matching the face of the woman in the attached reference images
    review:
      name: 리뷰&리뷰
      categories:                # 글감 분야: 매일 이 가운데 3개를 골라 하나씩 후보를 냄 (최근 쓴 분야는 쉼, 고양이는 사흘에 한 번까지)
